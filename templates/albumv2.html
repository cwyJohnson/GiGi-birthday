<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Special Album - For Gigi</title>
    <style>
        /* --- 基礎樣式 --- */
        :root {
            --bg-color: #0d1117; /* 深色背景，顯得更有質感 */
            --text-color: #e6edf3;
            --accent-color: #f78fb3; /* 浪漫的粉紅色 */
            --panel-bg: rgba(255, 255, 255, 0.05); /* 毛玻璃背景 */
            --font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* 防止滾動條影響觀感 */
        }

        /* --- 相簿主容器 --- */
        .album-container {
            width: 90%;
            max-width: 1200px;
            height: 85vh;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* --- 圖片區域 --- */
        .photo-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .photo-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transform: scale(1.1);
            transition: var(--transition);
            z-index: 1;
        }

        .photo-item.active {
            opacity: 1;
            transform: scale(1);
            z-index: 2;
        }

        /* 圖片上的陰影遮罩，讓文字更清晰 */
        .photo-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
        }

        /* --- 文字描述區域 --- */
        .description-panel {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 700px;
            padding: 30px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px); /* 毛玻璃效果 */
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            z-index: 10;
            opacity: 0;
            transform: translate(-50%, 20px);
            transition: var(--transition);
        }

        .description-panel.active {
            opacity: 1;
            transform: translate(-50%, 0);
            transition-delay: 0.3s;
        }

        .description-text {
            font-size: 1.2rem;
            line-height: 1.8;
            letter-spacing: 1px;
            font-weight: 300;
            min-height: 1.8em; /* 保持高度，防止打字時抖動 */
        }

        /* 打字機的光標效果 */
        .description-text::after {
            content: '|';
            animation: blink 1s infinite;
            color: var(--accent-color);
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* --- 導航控制區域 --- */
        .controls {
            padding: 20px 40px;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            z-index: 20;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: var(--text-color);
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #000;
            box-shadow: 0 0 15px rgba(247, 143, 179, 0.5);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-counter {
            font-size: 0.9rem;
            opacity: 0.7;
            font-weight: 300;
        }

        /* 頂部進度條 */
        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 3px;
            width: 0%;
            transition: width 0.4s ease;
            z-index: 30;
        }

        /* 手機端適配 */
        @media (max-width: 768px) {
            .album-container { height: 95vh; width: 95%; }
            .description-panel { width: 90%; padding: 20px; bottom: 80px; }
            .description-text { font-size: 1rem; }
            .controls { padding: 15px 20px; }
        }
        /* 音樂旋轉圖示 */
        .music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            padding: 10px;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: var(--transition);
        }

        .music-control.playing {
            animation: rotateMusic 3s linear infinite;
            box-shadow: 0 0 15px var(--accent-color);
        }

        @keyframes rotateMusic {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .music-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="music-control" id="musicBtn" onclick="toggleMusic()">
    <span class="music-icon">🎵</span>
    </div>
    <audio id="bgMusic" loop>
        <source src="/static/audio/KhalilFong.mp3" type="audio/mpeg">
    </audio>

    <div class="album-container">
        <div class="progress-bar" id="progressBar"></div>

        <div class="photo-wrapper">
            <div class="photo-item active" style="background-image: url('/static/images/12/5.JPG')"></div>
            <div class="photo-item" style="background-image: url('/static/images/12/6.JPG')"></div>
            <div class="photo-item" style="background-image: url('/static/images/12/7.JPG')"></div>
            <div class="photo-item" style="background-image: url('/static/images/12/8.JPG')"></div>
            <div class="photo-item" style="background-image: url('/static/images/12/9.JPG')"></div>
            <div class="photo-item" style="background-image: url('/static/images/12/10.JPG')"></div>
            <div class="photo-item" style="background-image: url('/static/images/12/11.JPG')"></div>
            <div class="photo-item" style="background-image: url('/static/images/12/12.JPG')"></div>
            <div class="photo-item" style="background-image: url('/static/images/12/1.JPG')"></div>
            <div class="photo-item" style="background-image: url('/static/images/12/2.JPG')"></div>
            <div class="photo-item" style="background-image: url('/static/images/12/3.JPG')"></div>
            <div class="photo-item" style="background-image: url('/static/images/12/4.JPG')"></div>
        </div>

        <div class="description-panel active" id="descPanel">
            <p class="description-text" id="typewriterText"></p>
        </div>

        <div class="controls">
            <button class="nav-btn" id="prevBtn" onclick="changePage(-1)" disabled>Prev</button>
            <div class="page-counter" id="pageCounter">1 / 12</div>
            <button class="nav-btn" id="nextBtn" onclick="changePage(1)">Next</button>
        </div>
    </div>

    <script>

            const bgMusic = document.getElementById('bgMusic');
            const musicBtn = document.getElementById('musicBtn');
            let musicStarted = false;

            function toggleMusic() {
                if (bgMusic.paused) {
                    bgMusic.play();
                    musicBtn.classList.add('playing');
                } else {
                    bgMusic.pause();
                    musicBtn.classList.remove('playing');
                }
            }

            // 修改原本的 changePage 函數，加入「第一次點擊即播放」的功能
            // 這樣可以繞過瀏覽器的自動播放限制
            const originalChangePage = changePage;
            changePage = function(direction) {
                if (!musicStarted) {
                    bgMusic.play();
                    musicBtn.classList.add('playing');
                    musicStarted = true;
                }
                originalChangePage(direction);
            };
        // --- 你的故事內容 (在這裡修改文字) ---
        const stories = [
            "5月是CHUCHUB和BBCHU正式一起的月份，亦都是我們幸福的起點。",
            "6月是CHUCHUB和BBCHU第一次去旅行，日本除了王子飯店，也有CHUCHUB王子和BBCHU公主。",
            "7月是CHUCHUB第一次騎著他的寶馬，接他的BBCHU收工。",
            "8月是我們第一個100日，亦是我們第一次去香港既酒店慶祝。",
            "9月是CHUCHUB既生日，亦都BBCHU為CHUCHUB整既生日驚喜。",
            "10月是CHUCHUB和BBCHU第一次鬧交最利害的月份，但亦是這張神作的月份。",
            "11月是是CHUCHUB和BBCHU第一次跑50K山賽既月份，攰到癲但好好玩。",
            "12月是CHUCHUB和BBCHU第一次見到雪，第一次滑雪，第一次係外地渣車。",
            "1月是CHUCHUB和BBCHU第一次一齊完成42K全馬拉松，BBCHU跑很快哦。",
            "2月是CHUCHUB和BBCHU第一次一齊去外地潛水。雖然有唔開心既地方，但更讓CHUCHUB明白的確很愛BBCHU。",
            "3月是CHUCHUB和BBCHU第一次一齊去迪士尼樂園，或者這次CHUCHUB可以令BBCHU愛上煙花。",
            "4月是CHUCHUB是第二次為BBCHU慶祝生日，CHUCHUB亦都成功實現他上年的願望。BBCHU生日快樂，希望下年我地仍可以一齊過。我愛你<3"
        ];

        let currentPage = 0;
        const totalPages = stories.length;
        let isTyping = false;
        let typingTimeout;

        // --- 核心功能：打字機效果 ---
        function typeWriter(text, i, fnCallback) {
            const element = document.getElementById("typewriterText");
            
            if (i < text.length) {
                element.innerHTML = text.substring(0, i + 1);
                isTyping = true;
                
                // 模擬人類打字速度不一的感覺
                let speed = 100; // 基礎速度
                if (text[i] === '，' || text[i] === '。') speed = 400; // 標點符號停頓

                typingTimeout = setTimeout(function() {
                    typeWriter(text, i + 1, fnCallback)
                }, speed);
            } else if (typeof fnCallback == 'function') {
                isTyping = false;
                setTimeout(fnCallback, 700);
            }
        }

        // --- 切換頁面邏輯 ---
        function changePage(direction) {
        const newPage = currentPage + direction;

        // 確保新頁數在 0 到 總頁數 之間
        if (newPage >= 0 && newPage < totalPages) {
        // 強制停止之前的打字效果，防止卡死
        clearTimeout(typingTimeout);
        isTyping = false; 

        currentPage = newPage;
        updateUI();
            }
        }

        // --- 更新介面顯示 ---
        function updateUI() {
            const photos = document.querySelectorAll('.photo-item');
            const descPanel = document.getElementById('descPanel');
            const textElement = document.getElementById("typewriterText");

            // 1. 更新圖片 (淡入淡出)
            photos.forEach(photo => photo.classList.remove('active'));
            photos[currentPage].classList.add('active');

            // 2. 更新按鈕狀態和計數器
            document.getElementById('prevBtn').disabled = (currentPage === 0);
            document.getElementById('nextBtn').disabled = (currentPage === totalPages - 1);
            document.getElementById('pageCounter').innerText = `${currentPage + 1} / ${totalPages}`;

            // 3. 更新進度條
            const progress = ((currentPage + 1) / totalPages) * 100;
            document.getElementById('progressBar').style.width = `${progress}%`;

            // 4. 更新文字 (重新開始打字動畫)
            descPanel.classList.remove('active'); // 先隱藏面板
            textElement.innerHTML = ""; // 清空文字

            // 等待面板淡出動畫完成後，再淡入並開始打字
            setTimeout(() => {
                descPanel.classList.add('active');
                // 面板淡入約需 0.3s，之後開始打字
                setTimeout(() => {
                    typeWriter(stories[currentPage], 0, null);
                }, 400);
            }, 300);
        }

        // --- 初始化 ---
        window.onload = function() {
            // 首次加載，延遲一下下開始打字，更有儀式感
            setTimeout(updateUI, 500);
        };
    </script>
</body>
</html>
