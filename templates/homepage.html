<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiGi Birthday - Homepage</title>
    <style>
        body {
            background-image: url('/static/images/chiikawaback.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }
        h2 {
            color: #d63384;
            margin-bottom: 0px;
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 20px;
        }
        .image-card {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .image-card:hover {
            transform: scale(1.05);
        }
        .image-card img {
            width: 100%;
            height: auto;
            display: block;
        }
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            color: white;
            padding: 15px;
            font-size: 1.2em;
        }
        .caption {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome to BBchu's Birthday Celebration</h2>

        <div class="image-grid">
            <!-- 第一張圖：跳轉到 Index -->
            <a href="/index" class="image-card">
                <img src="{{ url_for('static', filename='images/2025.png') }}" 
                     alt="進入主頁面">
                <div class="overlay">
                    <div class="caption">2025</div>
                </div>
            </a>

            <!-- 第二張圖：跳轉到 Game -->
            <a href="/game" class="image-card">
                <img src="{{ url_for('static', filename='images/2026cake.png') }}" 
                     alt="進入遊戲頁面">
                <div class="overlay">
                    <div class="caption">2026</div>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
